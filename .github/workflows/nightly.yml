name: Nightly Pre-Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get install -y --no-install-recommends jq zip

      - name: Build ZIP
        run: bash generate_zip.sh --no-update

      - name: Delete old nightly release
        run: |
          gh release delete nightly --yes 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly release
        run: |
          LAST_TAG=$(gh release list --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          if [[ -n "$LAST_TAG" ]]; then
            CHANGELOG="\n\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...main"
          else
            CHANGELOG=""
          fi
          gh release create nightly \
            --prerelease \
            --title "Nightly Build ($(date +%Y.%m.%d))" \
            --notes "Automatically generated from the latest commit on main.${CHANGELOG}" \
            KiCadPinout.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
