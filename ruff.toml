# Ruff configuration
# https://docs.astral.sh/ruff/

[lint]
# Enable specific rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear (bug detection)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # Line too long (handled by formatter)
    "B008",   # Do not perform function calls in argument defaults
    "N802",   # Function name should be lowercase (KiCad uses CamelCase)
    "N806",   # Variable in function should be lowercase
    "N801",   # Class name should use CapWords (KiCad_Pinout is project name)
    "N999",   # Invalid module name (KiCad_Pinout is project name)
]

# Exclude directories and generated files
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "venv",
    "test/old_code_*",
    "KiCad_Pinout/GUI.py",  # Generated by wxFormBuilder - do not modify
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"KiCad_Pinout/kicad_manager.py" = [
    "F401",  # has_pcbnew() and has_IPC() need imports to test availability
]

[format]
# Black-compatible formatting
quote-style = "double"
indent-style = "space"
line-ending = "auto"
