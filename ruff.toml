[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N801",   # class name CapWords (KiCadPinout is project name)
    "N802",   # function name lowercase (KiCad uses CamelCase)
    "N999",   # invalid module name (KiCadPinout is project name)
]
exclude = ["venv", "build", "dist", "KiCadPinout/gui.py"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]

[format]
quote-style = "double"
