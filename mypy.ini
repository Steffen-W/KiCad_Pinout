[mypy]
python_version = 3.10
warn_unused_configs = True
exclude = (^test/|KiCadPinout/gui\.py)

[mypy-pcbnew.*]
ignore_missing_imports = True

[mypy-kipy.*]
ignore_missing_imports = True

[mypy-wx.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-KiCadPinout.gui]
follow_imports = skip

[mypy-gui]
ignore_missing_imports = True

[mypy-kicad_manager]
ignore_missing_imports = True
