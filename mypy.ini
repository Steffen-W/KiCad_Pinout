[mypy]
# Global settings
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = False

# Exclude old test files and generated GUI
exclude = (^test/old_code_|KiCad_Pinout/GUI\.py)

# Ignore missing imports for external libraries without type stubs
[mypy-pcbnew.*]
ignore_missing_imports = True

[mypy-kipy.*]
ignore_missing_imports = True

[mypy-wx.*]
ignore_missing_imports = True

[mypy-GUI]
ignore_missing_imports = True

[mypy-kicad_manager]
ignore_missing_imports = True

# Per-module options for your code
[mypy-KiCad_Pinout.*]
# Enable stricter checking for your own code
warn_return_any = False
